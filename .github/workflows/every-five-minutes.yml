name: Print Numbers Every 50 Minutes

on:
  schedule:
    - cron: '*/50 * * * *'
  workflow_dispatch:

# Grant permission to push code changes back to the repository
permissions:
  contents: write

# Prevent scheduled runs from attempting to update main at the same time.
concurrency:
  group: log-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-python-loop:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Runs the script and generates/updates log.txt
    - name: Run Script
      run: python script.py

    # Automatically save and push the updated log.txt back to GitHub
    - name: Commit and Push Log File
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git pull --rebase --autostash origin main
        git add log.txt
        # Only commit if log.txt actually changed to avoid errors
        git diff-index --quiet HEAD || git commit -m "Automated log update"
        for attempt in 1 2 3; do
          if git push origin HEAD:main; then
            exit 0
          fi
          if [ "$attempt" -lt 3 ]; then
            git pull --rebase --autostash origin main
          fi
        done
        exit 1
