name: Print Numbers Every 5 Minutes

on:
  schedule:
    # Runs every 5 minutes (the maximum frequency allowed by GitHub)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows you to trigger it manually for testing

jobs:
  run-python-loop:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run Script
      run: python script.py
